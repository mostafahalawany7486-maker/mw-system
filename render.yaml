# Render Blueprint — see https://render.com/docs/blueprint-spec
#
# Deploys three resources:
#   1. pms-db        — managed Postgres
#   2. pms-backend    — FastAPI, built from backend/Dockerfile (same image
#                        used for local Docker dev — nothing Render-specific
#                        was added to it)
#   3. pms-frontend   — the React app, built as a static site (no Docker/
#                        nginx container needed for a purely static SPA —
#                        cheaper and simpler than the frontend/Dockerfile's
#                        nginx production target, which remains available
#                        for a non-Render Docker deployment)
#
# IMPORTANT — read before deploying:
#   Render normally assigns each service the URL https://<name>.onrender.com,
#   but appends a random suffix instead if that exact name is already taken
#   by someone else on the platform. BACKEND_CORS_ORIGINS, PUBLIC_APP_URL,
#   and VITE_API_BASE_URL below assume the exact names "pms-backend" and
#   "pms-frontend" were available. After the first deploy, open both
#   services in the Render dashboard and confirm their real URLs match —
#   if not, update those three env vars to the real ones and redeploy.
#
#   FIRST_ADMIN_PASSWORD and SECRET_KEY are intentionally NOT hardcoded
#   here (see envVars below) — Render will prompt you to set the admin
#   password yourself during Blueprint creation, and generates a random
#   SECRET_KEY automatically. Never reuse the demo password from
#   backend/.env.example on a real deployment.
#
#   Free-tier web services spin down after 15 minutes of inactivity and
#   take ~30-60s to wake on the next request — expected on `plan: free`,
#   not a bug. Free-tier disk is also ephemeral: local file storage
#   (STORAGE_BACKEND=local, the default here) does NOT persist across
#   deploys/restarts. For real attachment persistence, switch
#   STORAGE_BACKEND to azure_blob (already supported, see backend/.env.example)
#   or add a Render persistent disk on a paid plan.

databases:
  - name: pms-db
    databaseName: pms_db
    user: pms_user
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

